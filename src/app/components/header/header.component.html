<div class="header-container">
    <div class="header-title center">
      <div>{{ title | titlecase}}</div>
    </div>
    <div class="cards">
      @for (card of cards; track card) {
      <div class="card">
        <p> {{ card.label }}</p>
        <p>{{ card.value }}</p>
      </div>
    }
    </div>
</div>
